<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">NETTO — Portfólio Digital</title>
  <desc id="desc">Banner escuro e minimalista para o portfólio digital de Netto, com código, design, automação e IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08090C"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#23153D"/>
    </linearGradient>
    <linearGradient id="accent" x1="96" y1="176" x2="840" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="line" x1="1040" y1="112" x2="1440" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#fff" stroke-opacity="0.055"/>
    </pattern>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1420" cy="30" r="180" fill="#8B5CF6" fill-opacity="0.23" filter="url(#blur)"/>
  <circle cx="760" cy="560" r="170" fill="#2563EB" fill-opacity="0.16" filter="url(#blur)"/>
  <circle cx="150" cy="475" r="115" fill="#F97316" fill-opacity="0.11" filter="url(#blur)"/>

  <g opacity="0.85">
    <rect x="88" y="72" width="40" height="40" rx="11" fill="#fff" fill-opacity="0.95"/>
    <path d="M99 91.5L108 82L117 91.5L108 101L99 91.5Z" fill="#111827"/>
    <path d="M108 82V101" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round"/>
    <text x="150" y="99" fill="#CBD5E1" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="3">NETTO / PORTFÓLIO DIGITAL</text>
  </g>

  <text x="88" y="210" fill="#94A3B8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="600" letter-spacing="4">DEV · DESIGN · BOTS · AI · HACKING</text>
  <text x="88" y="302" fill="#FFFFFF" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="900" letter-spacing="-2">EU CONSTRUO</text>
  <text x="88" y="380" fill="url(#accent)" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="900" letter-spacing="-2">COISAS QUE VIVEM</text>
  <text x="88" y="458" fill="#FFFFFF" fill-opacity="0.92" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="72" font-weight="900" letter-spacing="-2">NA INTERNET.</text>

  <g filter="url(#shadow)">
    <rect x="1004" y="96" width="500" height="354" rx="22" fill="#0B1020" fill-opacity="0.92" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="1004" y="96" width="500" height="58" rx="22" fill="#FFFFFF" fill-opacity="0.045"/>
    <path d="M1004 132H1504" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <circle cx="1040" cy="125" r="7" fill="#FB7185"/>
    <circle cx="1064" cy="125" r="7" fill="#FBBF24"/>
    <circle cx="1088" cy="125" r="7" fill="#34D399"/>
    <text x="1120" y="131" fill="#94A3B8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">netto@internet ~ portfolio</text>

    <text x="1050" y="202" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">01</text>
    <text x="1090" y="202" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">const</text>
    <text x="1160" y="202" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">craft =</text>
    <text x="1248" y="202" fill="#FDBA74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">[</text>
    <text x="1264" y="202" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">'code'</text>
    <text x="1348" y="202" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">,</text>

    <text x="1050" y="246" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">02</text>
    <text x="1090" y="246" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">'design'</text>
    <text x="1190" y="246" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">,</text>
    <text x="1210" y="246" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">'automation'</text>
    <text x="1350" y="246" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">,</text>

    <text x="1050" y="290" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">03</text>
    <text x="1090" y="290" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">'AI'</text>
    <text x="1150" y="290" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">,</text>
    <text x="1170" y="290" fill="#93C5FD" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">'impact'</text>
    <text x="1262" y="290" fill="#FDBA74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">]</text>

    <text x="1050" y="350" fill="#64748B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">04</text>
    <text x="1090" y="350" fill="#C4B5FD" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">ship</text>
    <text x="1140" y="350" fill="#E2E8F0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="19">(craft);</text>
    <rect x="1090" y="378" width="284" height="3" rx="1.5" fill="url(#line)"/>
    <circle cx="1450" cy="382" r="7" fill="#34D399"/>
    <text x="1405" y="416" fill="#94A3B8" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" text-anchor="end">do conceito ao ar</text>
  </g>

  <rect x="88" y="510" width="1424" height="1" fill="#FFFFFF" fill-opacity="0.16"/>
  <text x="88" y="540" fill="#64748B" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="1.5">SITES · APPS · SAAS · BOTS · AUTOMAÇÃO · DESIGN</text>
  <text x="1512" y="540" fill="#64748B" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="end">GÓIAS</text>
</svg>
